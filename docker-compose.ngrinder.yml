version: '3.8'

services:
  ngrinder-controller:
    image: ngrinder/controller:latest
    container_name: ngrinder-controller
    ports:
      - "8300:80"        # nGrinder 웹 UI 접속 포트 (http://localhost:8300)
      - "16001:16001"    # Controller - Agent 통신 포트
      - "12000-12009:12000-12009" # 테스트 부하 분산 제어 포트
    volumes:
      - ngrinder-controller-data:/opt/ngrinder-controller
    restart: always

  ngrinder-agent:
    image: ngrinder/agent:latest
    container_name: ngrinder-agent
    depends_on:
      - ngrinder-controller
    command: ["controller:80"]
    links:
      - ngrinder-controller:controller
    extra_hosts:
      - "host.docker.internal:host-gateway" # Mac/Linux 로컬 Spring Boot 서버 접근용
    restart: always

volumes:
  ngrinder-controller-data:
